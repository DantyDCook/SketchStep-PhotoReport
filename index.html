<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102338"><title>SketchStep PhotoReport</title><link rel="manifest" href="/manifest.webmanifest"><body><header><strong>SketchStep / PhotoReport</strong><a href="https://sketchstep.dantydcook.com">SketchStep Web</a></header><main><h1>Photo documentation</h1><p>Import, organize and export. Photographs stay on this device.</p><section><h2>Report details</h2><label>Customer or report title <input id="customer" placeholder="Customer name"></label><label>Service address <input id="address"></label><label>Job / claim reference <input id="job"></label><label>Documentation date <input id="date" type="date"></label><label>Notes <textarea id="notes"></textarea></label></section><section><h2>Photographs</h2><label>Import images or ZIP <input id="files" type="file" multiple accept="image/*,.zip"></label><p id="status" role="status" aria-live="polite"></p><div id="photos"></div></section><section><h2>Export</h2><label>Photos per page <select id="layout"><option>2</option><option>1</option><option>4</option></select></label><label>Group by <select id="group"><option value="source">Import order</option><option value="room">Floor / room</option></select></label><button id="pdf">Download PDF</button> <button id="backup">Export editable project ZIP</button><label>Restore project ZIP (replaces current draft)<input id="restore" type="file" accept=".zip"></label><button id="clear">Clear local draft</button></section></main><footer>Part of the SketchStep ecosystem · <a href="https://dantydcook.com">Developer portfolio</a></footer><script type="module" src="/src/main.js"></script></body></html>
